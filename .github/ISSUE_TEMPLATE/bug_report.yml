name: Bug report
description: The guard did something wrong, or nothing.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Remove printer serial numbers and IP addresses** from everything you paste. Never post a LAN access code. The log and the output of `selftest` can hold serials and IP addresses.
  - type: input
    id: guard_version
    attributes:
      label: Guard version
      description: "`VERSION` in `filament_guard.py`, or the number in the zip's name."
    validations:
      required: true
  - type: input
    id: studio_version
    attributes:
      label: Bambu Studio version
    validations:
      required: true
  - type: input
    id: printer
    attributes:
      label: Printer model and firmware version
      placeholder: H2D, 01.04.20.00
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: selftest
    attributes:
      label: Output of `python filament_guard.py selftest`
      render: text
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log lines around the event
      description: From `%LOCALAPPDATA%\BambuFilamentGuard\guard.log`. Serials and IP addresses removed.
      render: text
