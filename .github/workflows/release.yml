name: release

# Run by hand (Actions > release > Run workflow) on main: tests, builds the zip, and publishes the GitHub release
# v<VERSION of filament_guard.py> with it. On a pull request that touches the build it does all but publish.
on:
  workflow_dispatch:
  pull_request:
    paths: ['.github/workflows/release.yml', '.github/scripts/**', 'build.py', 'requirements.txt']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write            # the release and its tag; used only by the last step, which a pull request does not reach
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: The amount window, as it looks on Windows
        run: python .github/scripts/amount_window.py dist/windows
      - run: python build.py
      - name: The packaged guard starts
        run: dist/BambuFilamentGuard/python.exe dist/BambuFilamentGuard/app/filament_guard.py --help
      - id: version
        run: echo "version=$(python -c 'import filament_guard; print(filament_guard.VERSION)')" >> "$GITHUB_OUTPUT"
      - run: python .github/scripts/release_notes.py "dist/BambuFilamentGuard-${{ steps.version.outputs.version }}.zip" > dist/notes.md && cat dist/notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: BambuFilamentGuard-${{ steps.version.outputs.version }}
          path: |
            dist/BambuFilamentGuard-${{ steps.version.outputs.version }}.zip
            dist/notes.md
            dist/windows/
      - name: Publish the release
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then echo "v$VERSION is released already"; exit 1; fi
          gh release create "v$VERSION" "dist/BambuFilamentGuard-$VERSION.zip" --target "$GITHUB_SHA" --title "Bambu Filament Guard $VERSION" --notes-file dist/notes.md
